name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Shared Node CI: npm ci, ESLint, typecheck, Vitest with a line-coverage gate, then `npm run check`
  # (lint + typecheck + tests + static export) and the static-export check from the old inline
  # workflow: out/ exists and robots.txt is `Disallow: /` by default. Fails closed.
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      require-tests: true
      coverage-threshold: "68"
      build-command: "NEXT_TELEMETRY_DISABLED=1 npm run check && test -d out && grep -Fxq 'Disallow: /' out/robots.txt"

  # Shared security scan: gitleaks, Semgrep, OSV-Scanner, Trivy.
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
